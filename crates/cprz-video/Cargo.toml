[package]
name = "cprz-video"
description = "Video: AV1, later AV2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust AV1 encoder (Xiph). Default features are off so the NASM
# assembler (the `asm` feature) is not needed; the pure-Rust fallback
# encodes the same AV1 bitstream, only slower.
rav1e = { version = "0.8", default-features = false }

