[package]
name = "cprz"
description = "Facade: shrink any payload as far as possible, then pad it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cprz-blob = { version = "0.0.0", path = "../cprz-blob" }
cprz-delta = { version = "0.0.0", path = "../cprz-delta" }
cprz-image = { version = "0.0.0", path = "../cprz-image" }
cprz-pad = { version = "0.0.0", path = "../cprz-pad" }
cprz-text = { version = "0.0.0", path = "../cprz-text" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
