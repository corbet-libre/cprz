[package]
name = "cprz"
description = "Facade: shrink any payload as far as possible, then pad it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["native"]
native = ["cprz-blob/zstd", "dep:cprz-delta", "dep:cprz-image", "dep:cprz-pad", "dep:cprz-text"]

[dependencies]
cprz-blob = { version = "0.0.0", path = "../cprz-blob", default-features = false }
cprz-delta = { version = "0.0.0", path = "../cprz-delta", optional = true }
cprz-image = { version = "0.0.0", path = "../cprz-image", optional = true }
cprz-pad = { version = "0.0.0", path = "../cprz-pad", optional = true }
cprz-text = { version = "0.0.0", path = "../cprz-text", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
